/* Layout: sea-green header band, a sticky search box with section tabs, one section visible at a time, results replace the section while searching. */
:root{
  --bg:#f1f4f8; --surface:#ffffff; --ink:#0f1e33; --muted:#55657a; --line:#d8e0ea;
  --amber:#ffb703; --amber-ink:#0b1f3a; --sea:#2a62a8; --ok:#1c7a4b; --warn:#a85d00;
  --band:#0b1f3a; --band-ink:#f4f6f8; --amber-text:#9a5b00; --note-bg:#fff4d6; --note-ink:#4a3300;
  --font-display:"Outfit","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08121f; --surface:#101f36; --ink:#e8eef7; --muted:#9db0c8; --line:#22344f;
  --amber:#ffb703; --amber-ink:#0b1f3a; --sea:#7db4f0; --ok:#4fc089; --warn:#f0a14a;
  --band:#06101d; --band-ink:#f4f6f8; --amber-text:#ffb703; --note-bg:#16263f; --note-ink:#f3e6bd; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08121f; --surface:#101f36; --ink:#e8eef7; --muted:#9db0c8; --line:#22344f;
  --amber:#ffb703; --amber-ink:#0b1f3a; --sea:#7db4f0; --ok:#4fc089; --warn:#f0a14a;
  --band:#06101d; --band-ink:#f4f6f8; --amber-text:#ffb703; --note-bg:#16263f; --note-ink:#f3e6bd; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55}
html[lang="ar"] body{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;line-height:1.75}
.wrap{max-width:44rem;margin:0 auto;padding-inline:16px;padding-block:0 40px}
header.band{background:var(--band);color:var(--band-ink);padding:18px 16px 14px}
.band-in{max-width:44rem;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{display:block;border-radius:9px}
.code{font-family:var(--font-display);font-weight:700;font-size:1rem;letter-spacing:.14em;background:var(--amber);color:var(--amber-ink);padding:2px 10px;border-radius:3px}
.tright{display:flex;align-items:center;gap:8px}
.themebtn{font:inherit;font-size:1.1rem;line-height:1;width:38px;height:38px;border-radius:6px;border:1px solid #46618a;background:transparent;color:var(--band-ink);cursor:pointer;display:flex;align-items:center;justify-content:center}
.themebtn:hover{background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid #46618a;border-radius:6px;overflow:hidden}
.lang button{background:transparent;color:var(--band-ink);border:0;padding:6px 14px;font:inherit;font-size:.9rem;cursor:pointer;min-height:36px}
.lang button[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);font-weight:600}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,9vw,3.4rem);line-height:1;margin:0;letter-spacing:.01em;text-wrap:balance}
html[lang="ar"] h1{font-size:clamp(2rem,8vw,3rem);line-height:1.25;letter-spacing:0}
.tagline{margin:0;color:#c3d0e4;font-size:.95rem;max-width:34rem}
.ticker{display:flex;align-items:stretch;background:var(--band);color:var(--band-ink);direction:ltr;border-bottom:1px solid rgba(255,255,255,.15);font-size:.92rem}
.ticker[hidden]{display:none}
.ticker-label{flex:none;background:var(--amber);color:var(--amber-ink);font-weight:700;padding:8px 12px;display:flex;align-items:center;white-space:nowrap}
html[lang="ar"] .ticker-label{direction:rtl}
.ticker-view{flex:1;min-width:0;overflow:hidden;direction:rtl;display:flex;align-items:center}
.ticker-track{display:inline-flex;white-space:nowrap;padding-right:100%;animation:tick 60s linear infinite;will-change:transform}
.ticker-item{padding:8px 0;unicode-bidi:isolate}
.ticker-item::after{content:"\25C6";color:var(--amber);margin:0 18px}
.ticker:hover .ticker-track,.ticker:focus-within .ticker-track,.ticker:active .ticker-track{animation-play-state:paused}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(100%)}}
@keyframes tickL{from{transform:translateX(0)}to{transform:translateX(-100%)}}
/* same direction in every language: the stripe always moves from left to right */
@media (prefers-reduced-motion:reduce){html:not([lang="ar"]) .ticker-track{padding-left:0}.ticker-track{animation:none;white-space:normal;padding:0;display:block}.ticker-item{display:block;padding:6px 10px}.ticker-item+.ticker-item::before{content:none}}
.unofficial{background:var(--note-bg);color:var(--note-ink);font-size:.85rem;font-weight:600;padding:10px 16px;border-inline-start:5px solid var(--amber)}
.unofficial p{max-width:44rem;margin:0 auto}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);border-bottom:1px solid var(--line)}
.search{max-width:44rem;margin:0 auto;padding:10px 16px 0;position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:12px 48px 12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-height:48px}
html[dir="rtl"] .search input{padding:12px 14px 12px 48px}
.search .clear{position:absolute;top:10px;inset-inline-end:16px;width:48px;height:48px;border:0;background:transparent;color:var(--muted);font-size:1.4rem;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
nav.tabs ul{list-style:none;margin:0 auto;padding:8px 8px 10px;max-width:44rem;display:flex;overflow-x:auto;gap:6px}
nav.tabs button{background:var(--amber);border:0;border-radius:6px;color:var(--amber-ink);font:inherit;font-weight:600;font-size:.92rem;padding:10px 14px;white-space:nowrap;cursor:pointer;min-height:44px}
nav.tabs button:hover{filter:brightness(.95)}
nav.tabs button[aria-selected="true"]{font-weight:700;background:#0b1f3a;color:#fff;box-shadow:0 0 0 2px var(--amber)}
nav.tabs button[aria-selected="true"]:hover{filter:none}
nav.tabs button:focus-visible,.lang button:focus-visible,button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sea);outline-offset:2px}

section{padding-block:24px 4px}
h2{font-family:var(--font-display);font-weight:700;font-size:1.9rem;line-height:1.1;margin:0 0 4px;text-wrap:balance}
html[lang="ar"] h2{font-size:1.55rem;line-height:1.4}
.lead{margin:0 0 16px;color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:3px;background:var(--line);color:var(--muted);white-space:nowrap}
html[lang="ar"] .tag{letter-spacing:0;text-transform:none;font-size:.78rem}
.sub{font-size:1.1rem;margin:26px 0 8px;font-weight:600}

.board{background:var(--band);color:var(--band-ink);border-radius:8px;overflow:hidden}
.board-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid #243d63;gap:8px}
.board-h strong{font-family:var(--font-display);font-size:1.15rem;letter-spacing:.06em;text-transform:uppercase}
html[lang="ar"] .board-h strong{letter-spacing:0;text-transform:none}
.row{display:grid;grid-template-columns:4.2rem 1fr auto;gap:10px;padding:12px 14px;border-bottom:1px solid #1a3052;align-items:center}
.row:last-child{border-bottom:0}
.row .t{font-family:var(--font-display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--amber-text)}
.row .d{min-width:0}.row .d b{display:block;font-weight:600}
.row .d span{font-size:.85rem;color:#c3d0e4}
.pill{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.ok{background:#12351f;color:#7fe0ac}.pill.late{background:#3d2a08;color:#ffc477}
.board-f{padding:10px 14px;font-size:.82rem;color:#c3d0e4;background:#0e2a4a}

.notice{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-inline-start:5px solid var(--warn);border-radius:6px;padding:12px 14px}
.notice b{display:block}
.notice small{color:var(--muted)}
.notice a,.card a{color:var(--sea)}

.list{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card h3{margin:0;font-size:1.05rem;min-width:0}
.card .area{color:var(--muted);font-size:.88rem;margin-top:2px}
.card p{margin:8px 0 0;color:var(--muted);font-size:.93rem}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin:12px 0 4px}.qa a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--sea);text-decoration:none;font-weight:600;font-size:.82rem;text-align:center}.qa a i{font-style:normal;font-size:1.2rem;line-height:1}.qa a:active{background:var(--line)}
.card .meta{margin-top:8px;font-size:.9rem;display:flex;gap:14px;flex-wrap:wrap}
.card small{display:block;margin-top:8px;color:var(--muted)}
.fnote{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.contactline{margin-top:6px}.wabtn{display:inline-block;padding:8px 14px;border-radius:999px;background:#1f9d55;color:#fff!important;font-weight:700;text-decoration:none!important}
.btn{display:inline-block;background:var(--amber);color:var(--amber-ink);font-weight:600;padding:12px 18px;border-radius:6px;text-decoration:none;min-height:44px}
.card .btn{color:var(--amber-ink);margin-top:12px}

.rwrap{display:grid;gap:4px;margin-bottom:14px}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.link{background:none;border:0;color:var(--sea);font:inherit;font-size:.88rem;cursor:pointer;padding:6px 0;min-height:36px;text-decoration:underline}
.rhead{font-weight:600;margin:18px 0 10px}

.routes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr))}
.route{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}
.route h3{margin:0;font-size:1rem}
.route .big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.1;margin:6px 0;font-variant-numeric:tabular-nums}
.route .big small{font-size:1rem;color:var(--muted);font-weight:600}
.route p{margin:0;font-size:.9rem;color:var(--muted)}

details{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
summary{cursor:pointer;padding:14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px;min-height:48px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:1.3rem;color:var(--sea);line-height:1}
details[open] summary::after{content:"\2212"}
details .body{padding:0 14px 14px;color:var(--muted);font-size:.95rem}
details .body ul{margin:0;padding-inline-start:1.2rem;display:grid;gap:6px}
details .body p{margin:0 0 8px}

.alerts{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:4px}
.alerts label{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-height:48px;cursor:pointer}
.alerts label:last-of-type{border-bottom:0}
.alerts input{width:22px;height:22px;accent-color:var(--sea);flex:none}
.alerts .status{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.saved{color:var(--ok);font-weight:600}

.wx{max-width:44rem;margin:0 auto;padding:12px 16px 0}
.wxcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.wxtop{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.wxtop button{font:inherit;font-size:.88rem;background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;min-height:34px;cursor:pointer}
.wxtop button[aria-pressed="true"]{background:var(--band);color:var(--band-ink);border-color:var(--band)}
.wxnow{display:flex;align-items:center;gap:12px}
.wxico{font-size:2.4rem;line-height:1}
.wxt{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.wxd{color:var(--muted);font-size:.95rem}
.wxm{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:.9rem;color:var(--muted)}
.wxdays{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.wxday{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:.85rem;color:var(--muted)}
.wxday b{display:block;color:var(--ink);font-weight:600}
.wxday .wxico{font-size:1.5rem;margin:2px 0}
.wxnote{margin:10px 0 0;font-size:.8rem;color:var(--muted)}
.dist{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.dist .btn{margin-top:0;border:0;font:inherit;font-weight:600;cursor:pointer}
.dist .res{margin-top:10px;display:grid;gap:4px;font-size:.95rem}
.dist .res strong{font-size:1.05rem}
.dist .link{display:inline-block;margin-top:6px;color:var(--sea);font-weight:600}

.cd{background:var(--band);color:var(--band-ink);border-radius:10px;padding:12px 14px}
.cd .top{display:flex;gap:12px;align-items:center}
.cd .top .lbl{font-weight:700;font-size:1rem;line-height:1.3}
.cd .last{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18);display:block;width:100%;text-align:start;background:transparent;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;cursor:pointer}
.cd .last .k{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.cd .last .t{margin-top:3px;font-size:.88rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px 0 4px;-webkit-overflow-scrolling:touch}
.gal img{flex:0 0 100%;max-width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;scroll-snap-align:start;background:var(--line)}
.gal.multi img{flex-basis:88%}
.pcredit{font-size:.75rem;color:var(--muted);margin:0 0 6px}
.qt blockquote{margin:0 0 8px;font-size:1.05rem;line-height:1.55;border-inline-start:3px solid var(--amber);padding-inline-start:12px}
.qby{font-weight:600;font-size:.92rem;margin:0 0 6px}
.list h3.sub{margin:16px 0 2px;font-size:1.1rem}
.offer{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--note-bg);color:var(--note-ink);font-size:.9rem}
.offer b{margin-inline-end:6px}
.tag.feat{background:var(--amber);color:var(--amber-ink)}
.foundbox{margin:10px 0 14px;padding:12px 14px;border-radius:10px;background:var(--note-bg);color:var(--note-ink);font-size:.92rem;border-inline-start:4px solid var(--amber)}
.foundbox b{color:var(--ink)}
.bkov{position:fixed;inset:0;background:rgba(5,12,24,.62);z-index:1100;display:flex;align-items:flex-end;justify-content:center}
.bkbox{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 22px}
@media (min-width:600px){.bkov{align-items:center}.bkbox{border-radius:14px}}
.bkbox h3{margin:0 0 6px}.bkbox h4{margin:12px 0 4px}
.bkf{display:block;margin:10px 0 0;font-weight:600;font-size:.92rem}
.bkf input,.bkf select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.bkchk{display:flex;gap:10px;align-items:flex-start;margin:14px 0 4px;font-size:.88rem}.bkchk input{margin-top:3px;width:20px;height:20px;flex:none}
.bkhp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.bkterms{font-size:.82rem;color:var(--muted);margin:8px 0}
.bkerr{color:var(--warn);font-weight:600;min-height:1.2em;margin:8px 0}
.bkok{color:var(--ok);font-weight:600}
.bkprice{font-weight:700;color:var(--amber-text);margin:4px 0}
.bkest{font-weight:600;margin:10px 0 0}
.bkqr canvas{display:block;margin:8px auto;max-width:100%;height:auto;background:#fff;border-radius:6px;image-rendering:pixelated}
.bkcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.4rem;text-align:center;letter-spacing:.08em;font-weight:700;margin:4px 0}
.bkpay{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.bkpay input{display:block;width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;min-height:44px}
.bkbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bkbox .btn,.bkbtns .btn{border:0;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
.btn2{display:inline-block;background:transparent;color:var(--ink);border:1px solid var(--line);font:inherit;font-weight:600;padding:10px 14px;border-radius:6px;min-height:44px;cursor:pointer;margin-top:10px}
.bkvid{display:block;width:100%;max-height:260px;margin-top:10px;border-radius:8px;background:#000}
.bkst{font-weight:700;margin:6px 0}.bkst-paid,.bkst-confirmed,.bkst-arrived{color:var(--ok)}.bkst-cancelled,.bkst-expired{color:var(--muted)}
.bkrow{margin:2px 0}
.nwagree{border-color:var(--amber);border-width:2px}.nwlang{display:flex;gap:14px;margin:4px 0 8px}

  legal:[
   ["دليل غير رسمي",["هذا الدليل مستقل. لا يديره ولا يعتمده ولا يتبناه مطار رينيه معوض ولا الجهة المشغلة ولا أي شركة طيران ولا أي جهة حكومية.","تُستخدم أسماء المطارات والشركات والأماكن فقط للدلالة عليها، وهي ملك لأصحابها. لا نستخدم أي شعارات رسمية."]],
   ["معلومات عامة فقط",["هذا الموقع والتطبيق للمعلومات فقط، ويقدمان معلومات عامة. قد تتغير الرحلات والجداول والأسعار والقواعد ومواعيد الافتتاح دون إشعار.","تأكد دائماً من شركة الطيران والمطار قبل السفر. لا تعتمد على هذا الدليل في قرارات السفر أو السلامة أو القانون أو الصحة."]],
   ["الدقة والمصادر",["نسعى إلى الدقة وإلى ذكر مصدر الأخبار والمعلومات وتاريخها. أوقات القيادة تقديرات تقريبية وليست حركة مرور مباشرة ولا ملاحة.","لا نضمن أن الدليل كامل أو محدّث. وبقدر ما يسمح القانون، لا يتحمل مالك الدليل مسؤولية الخسائر الناتجة عن الاعتماد عليه."]],
   ["الطقس والموقع",["يأتي الطقس من Open-Meteo وهو للمعلومات فقط. إذا اخترت حساب المسافة إلى المطار، يبقى موقعك على جهازك فقط، ولا نحفظه ولا يُرسل إلينا. وإذا ضغطت على رابط خرائط غوغل فسيُرسل موقعك إلى غوغل عبر ذلك الرابط.","المسافات والأوقات تقديرات تقريبية."]],   ["الإدراجات والروابط",["تظهر المطاعم والفنادق وسيارات الأجرة وغيرها فقط بموافقة أصحابها. تُوسَم الإدراجات المدفوعة أو الممولة بوضوح.","الروابط تقود إلى مواقع أخرى لا نتحكم بها."]],
   ["الخصوصية",["لا يطلب هذا الدليل اسمك ولا حساباً. نحسب الزيارات عبر Cloudflare Web Analytics الذي لا يستخدم ملفات تعريف الارتباط ولا يتتبع الزوار فرداً فرداً. تُحفظ اختياراتك للغة والتنبيهات على جهازك فقط.","الخطوط محفوظة داخل التطبيق نفسه، فلا تراك أي شركة خطوط. إذا أُضيفت الإشعارات الفورية فسنطلب إذنك أولاً ونشرح ما يُخزَّن."]],
   ["المحتوى وحقوق النشر",["النصوص أصلية أو مُعاد صياغتها من مصادر عامة مذكورة. إذا كنت تملك شيئاً معروضاً هنا وتريد تصحيحه أو إزالته فتواصل معنا وسنرد بسرعة."]],
   ["التواصل والتصحيحات",["للإبلاغ عن خطأ أو لطلب إزالة شيء، تواصل مع مالك الدليل."]]],
  contact_label:"التواصل", updated_label:"آخر تحديث",

function L(x){ return (x && typeof x === "object") ? [x.en, x.ar, x.fr].join(" ") : (x || ""); }
function buildIndex(){
  var out = [];
  FLIGHTS.forEach(function(r){
    out.push({cat:"qyt", hay:[r.time, L(r.city), L(r.type), L(r.status)].join(" "), build:function(){ return flightCard(r); }});
  });
  NOTICES.forEach(function(n){ out.push({cat:"notices", hay:[L(n.date), n.en, n.ar, n.fr || "", n.source].join(" "), build:function(){ return noticeNode(n); }}); });
  if (qytOn()) out.push({cat:"qyt", hay:"official airport page website qlayaat rené mouawad la page officielle de laéroport الصفحة الرسمية للمطار موقع القليعات", build:qytNode});
  out.push({cat:"bey", hay:"beirut rafic hariri airport flights arrivals departures official بيروت مطار رفيق الحريري رحلات وصول مغادرة", build:beirutNode});
  [["hotels",HOTELS],["restaurants",RESTAURANTS],["taxis",TAXIS],["cars",CARS],["sites",SITES]].forEach(function(p){
    p[1].forEach(function(e){
      out.push({cat:p[0], hay:[L(e.name), L(e.area), L(e.note), e.phone || "", e.source || ""].join(" "), build:function(){ return entryNode(e); }});
    });
  });
  NUMBERS.forEach(function(e){ out.push({cat:"info", hay:[L(e.name), L(e.note), e.phone, "emergency urgence طوارئ useful numbers numéros utiles أرقام"].join(" "), build:function(){ return entryNode(e, false); }}); });
  liveEvents().forEach(function(e){ out.push({cat:"events", hay:[L(e.title), L(e.place), L(e.note), e.date].join(" "), build:function(){ return eventNode(e); }}); });
  QUOTES.forEach(function(x){ out.push({cat:"phrases", hay:[x.text, x.by, x.src || ""].join(" "), build:function(){ return quoteNode(x); }}); });
  PHRASES.forEach(function(x){ out.push({cat:"phrases", hay:[x.en, x.fr, x.ar, x.say || ""].join(" "), build:function(){ return phraseNode(x); }}); });
  EPISODES.forEach(function(e){ out.push({cat:"history", hay:[L(e.title), e.date || "", L(e.text)].join(" "), build:function(){ return episodeNode(e); }}); });
  TIMELINE.forEach(function(t){ out.push({cat:"history", hay:[L(t.date), L(t.text)].join(" "), build:function(){ return timelineNode(t); }}); });
  T.en.routes.forEach(function(r, i){
    var a = T.ar.routes[i], f = T.fr.routes[i];
    out.push({cat:"info", hay:[r.from, r.txt, a.from, a.txt, f.from, f.txt].join(" "), build:function(){ var x = T[lang].routes[i]; return simpleCard(x.from + " · " + x.time + " " + x.unit, x.txt); }});
  });
  T.en.transport.forEach(function(r, i){
    var a = T.ar.transport[i], f = T.fr.transport[i];
    out.push({cat:"info", hay:[r[0], r[1], a[0], a[1], f[0], f[1]].join(" "), build:function(){ var x = T[lang].transport[i]; return simpleCard(x[0], x[1]); }});
  });
  T.en.guides.forEach(function(g, i){
    var a = T.ar.guides[i], f = T.fr.guides[i];
    out.push({cat:"info", hay:[g[0], g[1].join(" "), a[0], a[1].join(" "), f[0], f[1].join(" ")].join(" "), build:function(){ var x = T[lang].guides[i]; return simpleCard(x[0], x[1].join(" ")); }});
  });
  return out;
}

function applyView(){

  document.body.classList.toggle("pm", pageMode);
  VIEWS.forEach(function(v){ document.getElementById("v-" + v).hidden = searching || v !== view; });
  document.getElementById("results").hidden = !searching;
  var wxb = document.getElementById("wx"); if (wxb) wxb.hidden = searching || !window.__wxReady || !wxOpen;
  var ofw = document.getElementById("offerWrap"); if (ofw) ofw.hidden = searching || view !== "qyt";
  var cdb = document.getElementById("cdq"); if (cdb && cdb.firstChild) cdb.hidden = searching;
  document.getElementById("qclear").hidden = !searching;
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button, #bizList button, #floatList button"), function(b){
    b.setAttribute("aria-selected", (!searching && b.getAttribute("data-v") === view) ? "true" : "false");
  });
  floatTabsUpdate();
  if (searching) renderResults();
}

function haversine(a,b,c,d){

/* The knock on the glass: a short sound made by the phone itself (no sound file needed). */
function knockSound(ctx, t, out){
  var dest = out || ctx.destination;
  // the "tink" of a fingertip on glass: a few quick, high, fading tones
  [[1650,.34,.10],[2480,.20,.07],[3620,.12,.05],[5100,.06,.03]].forEach(function(p){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(p[0], t); o.frequency.exponentialRampToValueAtTime(p[0] * 0.97, t + p[2]);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p[1], t + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t + p[2]);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + p[2] + 0.02);

  bg.gain.setValueAtTime(0.0001, t); bg.gain.exponentialRampToValueAtTime(0.30, t + 0.003); bg.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  b.connect(bg); bg.connect(dest); b.start(t); b.stop(t + 0.08);

function playKnocks(t0){

    var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    var ctx = new AC();

}

function bk(k){ return (BK[lang] && BK[lang][k]) || BK.en[k] || k; }

function bkPatch(code, patch){ var a = bkList(); a.forEach(function(r){ if (r.code === code) for (var k in patch) r[k] = patch[k]; }); bkSave(a); }
function bkRec(code){ var a = bkList(); for (var i = 0; i < a.length; i++) if (a[i].code === code) return a[i]; return null; }
function bkPriceText(e){
  if (typeof e.price !== "number") return "";
  var p = "$" + e.price;
  if (e.cat === "hotel") return bk("from") + " " + p + " " + bk("night");
  if (e.cat === "taxi") return p + " " + bk("km");
  if (e.cat === "car") return p + " " + bk("day");
  if (e.cat === "restaurant") return p + " " + bk("per_person");
  return p;
}
function bkPost(obj, cb){
  var done = false, ctl = ("AbortController" in window) ? new AbortController() : null;
  var to = setTimeout(function(){ if (ctl) ctl.abort(); if (!done) { done = true; cb({ok:false, err:"network"}); } }, 20000);
  fetch(CONTENT_URL, {method:"POST", body:JSON.stringify(obj), signal: ctl ? ctl.signal : undefined})
    .then(function(r){ return r.json(); })
    .then(function(j){ clearTimeout(to); if (!done) { done = true; cb(j && typeof j === "object" ? j : {ok:false, err:"server"}); } })
    .catch(function(){ clearTimeout(to); if (!done) { done = true; cb({ok:false, err:"network"}); } });
}
function bkErr(code){ return bk("e_" + (code || "server")); }

var scanStream = null, scanTimer = null;
function stopScan(){
  if (scanTimer) clearInterval(scanTimer); scanTimer = null;
  if (scanStream) { try { scanStream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){} scanStream = null; }
}
function startScan(holder, onCode, onFail){
  if (!("BarcodeDetector" in window) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { onFail(); return; }
  var det; try { det = new BarcodeDetector({formats:["qr_code"]}); } catch(e){ onFail(); return; }
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}}).then(function(st){
    scanStream = st;
    var v = el("video","bkvid"); v.setAttribute("playsinline", ""); v.muted = true; v.srcObject = st; holder.appendChild(v);
    try { v.play(); } catch(e){}
    scanTimer = setInterval(function(){
      det.detect(v).then(function(r){
        if (!r || !r.length) return;
        var m = /NW-[A-Z0-9]{6}/.exec(r[0].rawValue || "");
        if (m) { stopScan(); if (v.parentNode) v.parentNode.removeChild(v); onCode(m[0]); }
      }).catch(function(){});
    }, 350);
  }).catch(onFail);
}

}

function bkShowCode(rec){
  bkModal(function(box, close){
    var body = el("div"); box.appendChild(body);
    var alive = true, tm = null;
    function paint(){
      body.textContent = "";
      body.appendChild(el("h3",null,bk("ok_title")));
      body.appendChild(el("p","bkprice",rec.name + " · " + rec.date));
      if (rec.route) body.appendChild(el("p",null,rec.route));
      var waiting = rec.pay && rec.payStatus !== "paid";
      if (!waiting) {
        var qb = el("div","bkqr"), cv = el("canvas"); qb.appendChild(cv); body.appendChild(qb);
        QR.draw(cv, "https://northwaylb.com/#p=" + rec.code, 260);
        body.appendChild(el("p","bkcode",rec.code));
        body.appendChild(el("p", rec.pay ? "bkok" : null, rec.pay ? bk("pay_ok") : bk("ok_qr")));
        if (!rec.pay) body.appendChild(el("p",null,bk("ok_direct")));
        else body.appendChild(el("p",null,bk("ok_qr")));
        return;
      }
      body.appendChild(el("p","bkcode",rec.code));
      var pb = el("div","bkpay");
      pb.appendChild(el("h4",null,bk("pay_title")));
      if (rec.disc) pb.appendChild(el("p","bkok","★ -$" + rec.disc));
      pb.appendChild(el("p",null,bkFmt(bk("pay_text"), {amount:rec.pay.amount, number:rec.pay.whish || "", code:rec.code})));
      pb.appendChild(el("p","bkok",bk("pay_nofee")));
      pb.appendChild(el("p","bkterms",bk("pay_same")));
      if (rec.payStatus === "unpaid") {
        var tx = bkInput("text"); tx.placeholder = bk("pay_ph"); tx.maxLength = 40; tx.setAttribute("dir","ltr"); pb.appendChild(tx);
        var pe = el("p","bkerr"); pb.appendChild(pe);
        var pbtn = el("button","btn",bk("pay_btn")); pbtn.type = "button"; pb.appendChild(pbtn);
        pbtn.addEventListener("click", function(){
          pbtn.disabled = true;
          bkPost({a:"paid", code:rec.code, txid:tx.value}, function(r){
            pbtn.disabled = false;
            if (!r || !r.ok) { pe.textContent = bkErr(r && r.err); return; }
            bkPatch(rec.code, {payStatus:"claimed"}); rec.payStatus = "claimed"; render(); paint();
          });
        });
      } else pb.appendChild(el("p","bkok",bk("pay_sent")));
      body.appendChild(pb);
      body.appendChild(el("p","bkterms",bk("pay_wait")));
    }
    function poll(){
      if (!alive || !document.body.contains(box)) { alive = false; return; }
      if (!(rec.pay && rec.payStatus !== "paid")) return;
      bkPost({a:"status", code:rec.code}, function(x){
        if (x && x.ok) {
          var ps = (x.pay_status === "paid" || x.pay_status === "claimed" || x.pay_status === "unpaid") ? x.pay_status : "direct";
          bkPatch(rec.code, {status:x.status, payStatus:ps});
          if (ps !== rec.payStatus) { rec.payStatus = ps; render(); if (alive) paint(); }
        }
        tm = setTimeout(poll, 15000);
      });
    }
    paint(); bkClose(box, function(){ alive = false; clearTimeout(tm); close(); });
    if (rec.pay && rec.payStatus !== "paid") tm = setTimeout(poll, 8000);
  });
}

function bkStatusKey(r){

  return r.status || "pending";
}

  bkList().forEach(function(r){ if ((r.biz === e.id || r.name === nm) && r.status === "confirmed") best = best || r; });
  return best;
}
function nwBookable(e){ return true; }          /* every rating needs a booking whose QR code the business scanned */
function nwRate(e, code){
  bkModal(function(box, close){
    box.appendChild(el("h3",null,nw("r_t").replace("{n}", tr(e.name))));
    var rec = code ? {code:code} : nwBookable(e) ? nwBookingFor(e) : null;
    if (nwBookable(e) && !rec) { box.appendChild(el("p",null,nw("r_need"))); bkClose(box, close); return; }
    var stars = 0, row = el("div","nwpick"), btns = [], f = {};
    box.appendChild(el("p",null,nw("r_stars")));
    for (var i = 1; i <= 5; i++) (function(n){
      var b = el("button",null,"☆"); b.type = "button"; b.setAttribute("aria-label", n + " / 5");
      b.addEventListener("click", function(){ stars = n; btns.forEach(function(x, k){ x.textContent = k < n ? "★" : "☆"; x.className = k < n ? "on" : ""; }); });
      btns.push(b); row.appendChild(b);
    })(i);
    box.appendChild(row);
    if (!rec) { bkField(box, f, "rphone", nw("r_phone"), bkInput("tel")); f.rphone.maxLength = 20; f.rphone.setAttribute("dir","ltr"); }
    bkField(box, f, "rcom", nw("r_comment"), bkInput("text")); f.rcom.maxLength = 200;
    var hp = bkInput("text"); hp.className = "bkhp"; hp.tabIndex = -1; hp.autocomplete = "off"; hp.setAttribute("aria-hidden","true"); box.appendChild(hp);
    var err = el("p","bkerr"); err.setAttribute("role","alert"); box.appendChild(err);
    var go = el("button","btn",nw("r_send")); go.type = "button"; box.appendChild(go); bkClose(box, close);
    go.addEventListener("click", function(){
      if (!stars) { err.textContent = nw("r_pick"); return; }
      err.textContent = ""; go.disabled = true;
      var body = {a:"rate", stars:stars, comment:f.rcom.value, hp:hp.value};
      if (rec) body.code = rec.code; else { body.biz = e.id; body.phone = f.rphone.value; }
      bkPost(body, function(r){
        go.disabled = false;
        if (!r || !r.ok) { if (r && r.err === "already") nwSetRated(e.id, stars); err.textContent = nwErr(r && r.err); return; }
        nwSetRated(e.id, stars); close(); alert(nw("r_thanks"));
        e.rate = {avg:r.avg, n:r.n, v:r.v}; render();
      });
    });
  });
}

var nwOwnerPin = "";                                              /* in memory only: never saved on the phone */
var OERR = {pin:"Wrong key.", locked:"Too many wrong tries. Press \"Forgot key?\" to reset it with your email.", key:"This phone is not the owner phone. Open your owner link again.", format:"The key must be exactly 4 digits.", code:"Wrong code.", expired:"The code expired. Ask for a new one.", state:"A key is already set.", email:"Type a valid email.", busy:"Too many tries. Try again later.", network:"No connection. Try again.", server:"Problem on the server. Try again.", owner_unset:"No key set yet.", mail:"The email could not be sent. In Apps Script run testOwnerEmail once and allow the permission."};

    function onHide(){ if (document.hidden && !waiting) lock(); }

    box.addEventListener("click", arm); box.addEventListener("input", arm); document.addEventListener("visibilitychange", onHide); arm();

    function field(label, type){ var l = el("label","bkf",label), i = bkInput(type || "text"); if (type === "password") { i.inputMode = "numeric"; i.maxLength = 4; i.autocomplete = "off"; } l.appendChild(i); view.appendChild(l); return i; }
